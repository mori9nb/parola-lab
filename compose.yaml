services:
  web:
    build: .
    ports: ["127.0.0.1:8080:8080"]
    depends_on: [api]
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://parola:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/parola
      API_TOKEN: ${API_TOKEN:?Set API_TOKEN}
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
  migrate:
    build: ./backend
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+psycopg://parola:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/parola
    depends_on:
      db: { condition: service_healthy }
  db:
    image: postgres:16-alpine
    ports:
      - "127.0.0.1:15432:5432"
    environment:
      POSTGRES_DB: parola
      POSTGRES_USER: parola
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parola -d parola"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
